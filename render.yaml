# Render Blueprint for the IIMA Marketplace backend (API).
# In Render: New → Blueprint → connect this repo → it reads this file.
# You still set the values marked `sync: false` in the dashboard.
services:
  - type: web
    name: iima-marketplace-api
    runtime: node
    rootDir: backend
    plan: free
    branch: dev
    buildCommand: npm install && npx prisma generate && npm run build
    # db push keeps the hosted Postgres schema in sync on each deploy (idempotent).
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL # Postgres connection string (Neon/Supabase)
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ALLOWED_EMAIL_DOMAIN
        value: iima.ac.in
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGIN # your Vercel frontend URL
        sync: false
      - key: PUBLIC_BASE_URL # this service's public URL
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SUPPORT_EMAIL
        value: p26ankur@iima.ac.in
